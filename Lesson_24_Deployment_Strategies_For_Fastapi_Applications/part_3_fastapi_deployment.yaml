apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi
        image: <your-account-id>.dkr.ecr.<region>.amazonaws.com/my-fastapi-app:latest
        ports:
        - containerPort: 80
